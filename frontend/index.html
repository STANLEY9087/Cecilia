<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cecilia - 15 Anos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --color-bg: #0a0a1a;
      --color-primary: #c9a84c;
      --color-primary-light: #e8d48b;
      --color-violet: #7b5ea7;
      --color-violet-light: #a78bca;
      --color-text: #e8e6f0;
      --color-text-muted: #9a96b0;
      --color-border: rgba(201, 168, 76, 0.2);
      --font-title: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Montserrat', 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }

    .stars-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }
    .star {
      position: absolute; width: 2px; height: 2px; background: #fff;
      border-radius: 50%; animation: twinkle var(--dur, 3s) ease-in-out infinite;
      animation-delay: var(--del, 0s); opacity: 0;
    }
    @keyframes twinkle { 0%,100% { opacity: 0.1; } 50% { opacity: 0.8; } }

    .content { position: relative; z-index: 1; max-width: 600px; }
    .logo-name {
      font-family: var(--font-title); font-size: clamp(2.5rem, 7vw, 4rem);
      font-weight: 600; color: var(--color-primary); letter-spacing: 0.2em;
    }
    .logo-age {
      font-family: var(--font-title); font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700; display: block; margin-top: -0.5rem;
      background: linear-gradient(135deg, var(--color-primary), var(--color-violet-light));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      font-family: var(--font-title); font-size: 1.1rem; font-style: italic;
      color: var(--color-violet-light); margin: 1.5rem 0 0.5rem;
    }
    .date {
      font-size: 0.9rem; color: var(--color-text-muted); font-weight: 300;
      letter-spacing: 0.1em; margin-bottom: 2.5rem;
    }
    .cta-link {
      display: inline-block; padding: 0.75rem 2rem; text-decoration: none;
      background: linear-gradient(135deg, var(--color-primary), var(--color-violet));
      color: #fff; font-family: var(--font-body); font-size: 0.9rem; font-weight: 500;
      letter-spacing: 0.08em; border-radius: 8px; transition: opacity 0.3s;
    }
    .cta-link:hover { opacity: 0.9; }
    .footer {
      position: relative; z-index: 1; margin-top: 3rem;
      font-size: 0.7rem; color: var(--color-text-muted); opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="stars-bg" id="starsBg"></div>
  <div class="content">
    <span class="logo-name">CECILIA</span>
    <span class="logo-age">15</span>
    <p class="tagline">Convite Especial</p>
    <p class="date">Celebre comigo esta noite inesquecivel</p>
    <a href="convite/index.html" class="cta-link">Fotos</a>
  </div>
  <footer class="footer">&copy; 2026 - Cecilia 15 Anos</footer>
  <script>
    (function() {
      var bg = document.getElementById('starsBg');
      for (var i = 0; i < 50; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--dur', 2 + Math.random() * 4 + 's');
        s.style.setProperty('--del', Math.random() * 4 + 's');
        var sz = 1 + Math.random() * 2;
        s.style.width = sz + 'px'; s.style.height = sz + 'px';
        bg.appendChild(s);
      }
    })();
  </script>
</body>
</html>
